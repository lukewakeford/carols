<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chichester Dec 6 — Electric Guitar Carols Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-subtle: #e2e8f0;
      --accent: #0284c7;
      --accent-soft: #e0f2fe;
    }

    :root,
    body.stage-mode {
      --bg-main: #05070a;
      --bg-card: #0f141c;
      --bg-subtle: #18202c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: #273244;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-header {
      padding-top: calc(env(safe-area-inset-top, 0px) + 0.5rem);
    }

    @media (max-width: 640px) {
      .app-header button,
      .app-header a {
        min-height: 44px;
        padding-block: 0.625rem;
        padding-inline: 0.75rem;
      }

      input:not([type="file"]),
      select,
      textarea {
        font-size: 16px;
      }
    }

    .font-mono-chord {
      font-family: 'JetBrains Mono', monospace;
    }

    .surface-card {
      background-color: var(--bg-card);
      border-color: var(--border-subtle);
    }

    .surface-subtle {
      background-color: var(--bg-subtle);
      border-color: var(--border-subtle);
    }

    .text-muted-custom {
      color: var(--text-muted);
    }

    /* Custom subtle scrollbar for wide tables on mobile */
    .table-scroll::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    .table-scroll::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.35);
      border-radius: 9999px;
    }

    /* Call sheet bar spacing & alternating bar shading */
    .bar-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
    }

    .bar-cell {
      display: inline-flex;
      align-items: center;
      border-radius: 0.6rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--border-subtle);
      line-height: 1.35;
    }

    .bar-cell-even {
      background-color: rgba(2, 132, 199, 0.06);
    }

    .bar-cell-odd {
      background-color: rgba(148, 163, 184, 0.14);
    }

    body.stage-mode .bar-cell-even {
      background-color: rgba(56, 189, 248, 0.12);
    }

    body.stage-mode .bar-cell-odd {
      background-color: rgba(15, 23, 42, 0.72);
    }

    .bar-marker {
      font-weight: 800;
      opacity: 0.75;
      padding: 0 0.15rem;
    }

    .bar-note-text {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.8125rem;
      font-weight: 600;
      line-height: 1.45;
    }
  </style>
</head>
<body class="min-h-screen pb-8">
  <!-- Toast / Message Banner (replaces alert/confirm) -->
  <div id="toastBanner" class="fixed top-4 right-4 z-50 hidden max-w-sm rounded-xl border border-sky-400/40 bg-slate-900 px-4 py-3 text-sm font-medium text-white shadow-xl">
    <div class="flex items-center gap-2.5">
      <span id="toastText">Saved</span>
    </div>
  </div>

  <!-- Top Navigation & Stage Controls -->
  <header id="mainHeader" class="app-header sticky top-0 z-30 border-b surface-card">
    <div id="trackerHeaderSlot" class="mx-auto max-w-6xl px-3 py-2.5 sm:px-5">
      <!-- Rendered via buildSharedHeaderBar("tracker") -->
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="mainContent" class="mx-auto max-w-6xl px-3 pt-3.5 sm:px-5">
    <!-- VIEW 1: SETLIST & PRACTICE TRACKER -->
    <section id="trackerView" class="space-y-3">
      <!-- Setlist Tracker Table (#1-#10 fixed in column 1) -->
      <div class="overflow-hidden rounded-2xl border surface-card shadow-sm">
        <div class="table-scroll overflow-x-auto">
          <table class="w-full min-w-[920px] border-collapse text-left">
            <thead>
              <tr class="border-b text-xs font-bold uppercase tracking-wider text-muted-custom surface-subtle">
                <th class="sticky left-0 z-10 w-16 border-r px-3 py-3.5 text-center surface-subtle">
                  <button
                    id="sortOrderHeaderBtn"
                    type="button"
                    onclick="toggleHeaderSort('order')"
                    class="inline-flex w-full items-center justify-center gap-1 font-bold uppercase tracking-wider hover:text-sky-400"
                    title="Sort by song number"
                  >
                    <span>#</span>
                    <span id="sortOrderIndicator" class="font-mono-chord text-[10px]"></span>
                  </button>
                </th>
                <th class="px-4 py-3.5">Song & Arrangement</th>
                <th class="px-3 py-3.5">Key & Rig</th>
                <th class="px-3 py-3.5">Tempo / Meter</th>
                <th class="px-3 py-3.5">
                  <button
                    id="sortStatusHeaderBtn"
                    type="button"
                    onclick="toggleHeaderSort('status')"
                    class="inline-flex items-center gap-1 font-bold uppercase tracking-wider hover:text-sky-400"
                    title="Sort by status"
                  >
                    <span>Status</span>
                    <span id="sortStatusIndicator" class="font-mono-chord text-[10px]"></span>
                  </button>
                </th>
                <th class="px-4 py-3.5">Guitar Notes & Cues</th>
              </tr>
            </thead>
            <tbody id="trackerTableBody" class="divide-y" style="border-color: var(--border-subtle);">
              <!-- Rows rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- VIEW 2: GUITAR CHORD & CALL SHEETS -->
  <section id="callSheetsView" class="hidden space-y-3.5">
    <!-- Call Sheet Header Bar (exact same top placement & bar geometry as top header bar) -->
    <header id="callSheetHeaderBar" class="app-header sticky top-0 z-30 border-b surface-card">
      <div id="callSheetHeaderSlot" class="mx-auto max-w-6xl px-3 py-2.5 sm:px-5">
        <!-- Rendered via buildSharedHeaderBar("callSheets") -->
      </div>
    </header>

    <div class="mx-auto max-w-6xl space-y-3.5 px-3 sm:px-5">
      <!-- Collapsible Transpose Drawer -->
      <div id="transposeDrawer" class="hidden rounded-2xl border p-3 surface-card">
        <div class="mb-2 flex items-center justify-between gap-2">
          <span class="text-[11px] font-bold uppercase tracking-wider text-muted-custom">Transpose Chords</span>
          <span id="transposeReadout" class="font-mono-chord text-xs font-bold text-sky-600 dark:text-sky-400">
            0 semitones (Original)
          </span>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          <button data-shift="-3" class="shift-btn rounded-xl border surface-subtle px-3 py-1.5 font-mono-chord text-xs font-bold hover:border-sky-500">
            -3st
          </button>
          <button data-shift="-1" class="shift-btn rounded-xl border surface-subtle px-3 py-1.5 font-mono-chord text-xs font-bold hover:border-sky-500">
            -1
          </button>
          <button data-shift="0" class="shift-btn rounded-xl bg-sky-600 px-3 py-1.5 font-mono-chord text-xs font-bold text-white">
            0
          </button>
          <button data-shift="1" class="shift-btn rounded-xl border surface-subtle px-3 py-1.5 font-mono-chord text-xs font-bold hover:border-sky-500">
            +1
          </button>
          <button data-shift="2" class="shift-btn rounded-xl border surface-subtle px-3 py-1.5 font-mono-chord text-xs font-bold hover:border-sky-500">
            +2
          </button>
        </div>
      </div>

      <!-- Active Call Sheet Card -->
      <div id="callSheetContainer">
        <!-- Populated dynamically -->
      </div>
    </div>
  </section>

  <!-- Collapsible Metronome & Tap Tempo Drawer (positioned below active header) -->
  <section id="metronomeDrawer" class="hidden border-b surface-card">
    <div class="mx-auto max-w-6xl px-3 py-3 sm:px-5">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div class="flex flex-wrap items-center gap-3">
          <button
            id="metroPlayBtn"
            type="button"
            class="inline-flex items-center gap-2 rounded-xl bg-sky-600 px-4 py-2.5 text-sm font-bold text-white shadow transition hover:bg-sky-500"
          >
            <span id="metroPlayIcon">▶</span>
            <span id="metroPlayLabel">Start Click</span>
          </button>

          <button
            id="tapTempoBtn"
            type="button"
            class="rounded-xl border border-sky-500/40 bg-sky-500/10 px-4 py-2.5 text-sm font-bold text-sky-600 dark:text-sky-300 transition hover:bg-sky-500/20"
          >
            Tap Tempo
          </button>

          <div class="flex items-center gap-2">
            <label for="bpmInput" class="text-xs font-semibold text-muted-custom">BPM</label>
            <input
              id="bpmInput"
              type="number"
              min="35"
              max="240"
              value="100"
              class="w-20 rounded-xl border surface-subtle px-2.5 py-2 text-center font-mono-chord text-sm font-bold"
            />
          </div>

          <div class="flex items-center gap-2">
            <label for="timeSigSelect" class="text-xs font-semibold text-muted-custom">Meter</label>
            <select
              id="timeSigSelect"
              class="rounded-xl border surface-subtle px-2.5 py-2 text-sm font-semibold"
            >
              <option value="4">4/4 (4 beats)</option>
              <option value="6">6/8 (6 pulses)</option>
              <option value="12">12/8 (Compound)</option>
              <option value="3">3/4 (3 beats)</option>
            </select>
          </div>
        </div>

        <!-- Beat Indicators -->
        <div id="beatDots" class="flex items-center gap-2">
          <!-- Rendered dynamically -->
        </div>

        <button
          id="closeMetronomeBtn"
          type="button"
          class="rounded-lg px-2.5 py-1 text-xs font-semibold text-muted-custom hover:bg-slate-500/10"
        >
          Hide
        </button>
      </div>
    </div>
  </section>

  <!-- Hidden File Input for Per-Song Rehearsal Audio -->
  <input id="audioFileInput" type="file" accept="audio/*,video/mp4" class="hidden" />
  <audio id="rehearsalAudioElement" class="hidden"></audio>

  <script>
    // =========================================================================

    // =========================================================================
    const SPOTIFY_PLAYLIST_URL =
      "https://open.spotify.com/playlist/5A4qBl2T2b2XvL1CNnuA4U?si=QGBFYLGoT8e9N0YCs_ocRw";

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { songs: structuredClone(DEFAULT_SONGS), stageMode: true };
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.songs) || parsed.songs.length === 0) {
          return { songs: structuredClone(DEFAULT_SONGS), stageMode: true };
        }
        // Merge saved status & notes onto all default song definitions so all 10 tracks stay present
        const merged = DEFAULT_SONGS.map((def) => {
          const saved = Array.isArray(parsed.songs) ? parsed.songs.find((s) => s.id === def.id) : null;
          return {
            ...def,
            status: saved?.status || def.status,
            notes: typeof saved?.notes === "string" ? saved.notes : def.notes
          };
        });
        return { songs: merged, stageMode: true };
      } catch (err) {
        console.error("Failed to load saved state:", err);
        return { songs: structuredClone(DEFAULT_SONGS), stageMode: true };
      }
    }

    // =========================================================================
    // 3. CHORD TRANSPOSITION ENGINE
    // =========================================================================
    const SHARP_NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const FLAT_NOTES  = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

    function noteToIndex(note) {
      const map = {
        C: 0, "B#": 0,
        "C#": 1, Db: 1,
        D: 2,
        "D#": 3, Eb: 3,
        E: 4, Fb: 4,
        F: 5, "E#": 5,
        "F#": 6, Gb: 6,
        G: 7,
        "G#": 8, Ab: 8,
        A: 9,
        "A#": 10, Bb: 10,
        B: 11, Cb: 11
      };
      return map[note] ?? -1;
    }

    function transposeRoot(note, semitones, preferFlats = false) {
      const idx = noteToIndex(note);
      if (idx === -1) return note;
      const target = (((idx + semitones) % 12) + 12) % 12;
      return preferFlats ? FLAT_NOTES[target] : SHARP_NOTES[target];
    }

    function transposeChordToken(token, semitones, preferFlats = false) {
      if (!semitones) return token;
      // Preserve bracketed notes or N.C.
      if (token.startsWith("[") || token === "N.C.") return token;
      // Match leading note (e.g. F#, Bb, C) + remainder + optional /bassNote
      const match = token.match(/^([A-G][#b]?)([^/]*)(?:\/([A-G][#b]?))?$/);
      if (!match) return token;
      const [, root, qual, bass] = match;
      const newRoot = transposeRoot(root, semitones, preferFlats);
      const newBass = bass ? "/" + transposeRoot(bass, semitones, preferFlats) : "";
      return `${newRoot}${qual}${newBass}`;
    }

    function transposeProgressionString(line, semitones, preferFlats = false) {
      if (!semitones) return line;
      // Split by whitespace while keeping punctuation like | or :|| intact
      return line
        .split(/(\s+)/)
        .map((part) => {
          if (/^\s+$/.test(part)) return part;
          if (/^[|:]+$/.test(part) || part.startsWith("(") || part.endsWith(")")) return part;
          return transposeChordToken(part, semitones, preferFlats);
        })
        .join("");
    }

    // Split a transposed chord line by '|' bars while preserving repeat markers & prose notes
    function renderBarBlocksHtml(transposedLine) {
      const trimmed = String(transposedLine || "").trim();
      if (!trimmed) return "";

      // If a section is a descriptive prose note with no bar pipes, render cleanly
      if (!trimmed.includes("|")) {
        return `<div class="bar-note-text text-muted-custom">${escapeHtml(trimmed)}</div>`;
      }

      const rawBars = trimmed.split("|");
      let barIndex = 0;

      const items = rawBars
        .map((chunk) => chunk.trim())
        .filter((chunk) => chunk.length > 0)
        .map((chunk) => {
          let prefixMarker = "";
          let suffixMarker = "";
          let content = chunk;

          // Pull leading repeat start (e.g. "||:" or ":") if present
          const leadingRepeat = content.match(/^(\|\|:|:)\s*(.*)$/);
          if (leadingRepeat) {
            prefixMarker = leadingRepeat[1];
            content = leadingRepeat[2].trim();
          }

          // Pull trailing repeat end (e.g. ":||" or ":") if present
          const trailingRepeat = content.match(/^(.*?)\s*([:]*\|\||:)$/);
          if (trailingRepeat && trailingRepeat[1].trim().length > 0) {
            content = trailingRepeat[1].trim();
            suffixMarker = trailingRepeat[2];
          }

          const parts = [];
          if (prefixMarker) {
            parts.push(`<span class="bar-marker text-sky-600 dark:text-sky-400">${escapeHtml(prefixMarker)}</span>`);
          }
          if (content) {
            const shadeClass = barIndex % 2 === 0 ? "bar-cell-even" : "bar-cell-odd";
            barIndex += 1;
            parts.push(`<span class="bar-cell ${shadeClass}">${escapeHtml(content)}</span>`);
          }
          if (suffixMarker) {
            parts.push(`<span class="bar-marker text-sky-600 dark:text-sky-400">${escapeHtml(suffixMarker)}</span>`);
          }

          return `<span class="inline-flex items-center gap-1">${parts.join("")}</span>`;
        })
        .filter((item) => item.length > 0);

      if (items.length === 0) {
        return `<div class="bar-note-text text-muted-custom">${escapeHtml(trimmed)}</div>`;
      }

      return `<div class="bar-grid font-mono-chord text-xs font-bold sm:text-sm">${items.join("")}</div>`;
    }

    // In renderCallSheetView()
    function renderCallSheetView() {
      const song = state.songs.find((s) => s.id === selectedCallSheetId) || state.songs[0];
      selectedCallSheetId = song.id;

      const headerSlot = document.getElementById("callSheetHeaderSlot");
      if (headerSlot) {
        headerSlot.innerHTML = buildSharedHeaderBar("callSheets", song);
      }

      const preferFlats = transposeSemitones < 0 || ["F", "Bb", "Eb", "Ab", "Cm"].includes(song.key);
      const transposedKey = transposeChordToken(song.key, transposeSemitones, preferFlats);

      const drawerEl = document.getElementById("transposeDrawer");
      drawerEl.classList.toggle("hidden", !transposeDrawerOpen);

      const shiftLabel =
        transposeSemitones === 0
          ? "0 semitones (Original)"
          : `${transposeSemitones > 0 ? "+" : ""}${transposeSemitones} semitones → ${transposedKey}`;
      document.getElementById("transposeReadout").textContent = shiftLabel;

      // Highlight active shift button
      document.querySelectorAll(".shift-btn").forEach((btn) => {
        const val = Number(btn.dataset.shift);
        if (val === transposeSemitones) {
          btn.className = "shift-btn rounded-xl bg-sky-600 px-3 py-1.5 font-mono-chord text-xs font-bold text-white";
        } else {
          btn.className = "shift-btn rounded-xl border surface-subtle px-3 py-1.5 font-mono-chord text-xs font-bold hover:border-sky-500";
        }
      });

      const sectionsHtml = song.sections
        .map((sec) => {
          const renderedChords = transposeProgressionString(sec.chords, transposeSemitones, preferFlats);
          const hintHtml =
            showPhraseCues && sec.timingHint
              ? `<div class="mt-1.5 text-xs font-medium text-amber-700 dark:text-amber-300">${escapeHtml(
                  sec.timingHint

          return `

              ${hintHtml}

        })
        .join("");

      document.getElementById("callSheetContainer").innerHTML = `
        <div class="rounded-2xl border p-4 surface-card shadow-sm">

    // =========================================================================
    // 5. WEB AUDIO METRONOME / TAP TEMPO
    // =========================================================================
    // Web Audio Click Track
    let audioCtx = null;
    let metroTimer = null;
    let metroPlaying = false;
    let currentBeat = 0;
    let tapTimes = [];

    function renderBeatDots() {
      const beats = Number(document.getElementById("timeSigSelect").value) || 4;
      const container = document.getElementById("beatDots");
      container.innerHTML = Array.from({ length: beats }, (_, i) => {
        const active = metroPlaying && currentBeat === i;
        return `<span class="h-3.5 w-3.5 rounded-full transition ${
          active
            ? i === 0
              ? "scale-125 bg-amber-400 shadow"
              : "scale-110 bg-sky-500 shadow"
            : "bg-slate-400/30"
        }"></span>`;
      }).join("");
    }

    function playClickSound(isAccent) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = isAccent ? 1050 : 720;
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.065);
      } catch (err) {
        console.error("Click audio error:", err);
      }
    }

    function startMetronome() {
      stopMetronome();
      const bpm = Math.min(240, Math.max(35, Number(document.getElementById("bpmInput").value) || 100));
      const beatsPerBar = Number(document.getElementById("timeSigSelect").value) || 4;
      const intervalMs = (60 / bpm) * 1000;

      metroPlaying = true;
      currentBeat = 0;
      document.getElementById("metroPlayIcon").textContent = "■";
      document.getElementById("metroPlayLabel").textContent = "Stop Click";

      const tick = () => {
        playClickSound(currentBeat === 0);
        renderBeatDots();
        currentBeat = (currentBeat + 1) % beatsPerBar;
      };

      tick();
      metroTimer = setInterval(tick, intervalMs);
    }

    function stopMetronome() {
      metroPlaying = false;
      clearInterval(metroTimer);
      metroTimer = null;
      currentBeat = 0;
      document.getElementById("metroPlayIcon").textContent = "▶";
      document.getElementById("metroPlayLabel").textContent = "Start Click";
      renderBeatDots();
    }

    function loadBpmToClick(bpm, meter) {
      document.getElementById("bpmInput").value = bpm;
      const sigSelect = document.getElementById("timeSigSelect");
      if (meter.includes("6/8")) sigSelect.value = "6";
      else if (meter.includes("12/8")) sigSelect.value = "12";
      else if (meter.includes("3/4")) sigSelect.value = "3";
      else sigSelect.value = "4";

      document.getElementById("metronomeDrawer").classList.remove("hidden");
      renderBeatDots();
      if (metroPlaying) startMetronome();
      showToast(`Click set to ${bpm} BPM (${meter})`);
    }

    function toggleMetronomeDrawer() {
      const drawer = document.getElementById("metronomeDrawer");
      const anchorHeader =
        activeTab === "callSheets"
          ? document.getElementById("callSheetHeaderBar")
          : document.getElementById("mainHeader");
      if (drawer && anchorHeader && anchorHeader.parentNode) {
        anchorHeader.insertAdjacentElement("afterend", drawer);
      }
      drawer.classList.toggle("hidden");
      renderBeatDots();
    }

    document.getElementById("closeMetronomeBtn").addEventListener("click", () => {
      document.getElementById("metronomeDrawer").classList.add("hidden");
    });
    document.getElementById("metroPlayBtn").addEventListener("click", () => {
      if (metroPlaying) stopMetronome();
      else startMetronome();
    });
    document.getElementById("bpmInput").addEventListener("change", () => {
      if (metroPlaying) startMetronome();
    });
    document.getElementById("timeSigSelect").addEventListener("change", () => {
      renderBeatDots();
      if (metroPlaying) startMetronome();
    });
    document.getElementById("tapTempoBtn").addEventListener("click", () => {
      const now = performance.now();
      tapTimes = tapTimes.filter((t) => now - t < 2500);
      tapTimes.push(now);
      if (tapTimes.length >= 2) {
        let sum = 0;
        for (let i = 1; i < tapTimes.length; i++) sum += tapTimes[i] - tapTimes[i - 1];
        const avgMs = sum / (tapTimes.length - 1);
        const tappedBpm = Math.min(240, Math.max(35, Math.round(60000 / avgMs)));
        document.getElementById("bpmInput").value = tappedBpm;
      if (metroPlaying) startMetronome();
    }
    playClickSound(true);
  });

  // =========================================================================
    // In switchTab(tabName)
    function switchTab(tabName) {
      activeTab = tabName;
      syncHeaderVisibilityForTab(tabName);
      const mainContent = document.getElementById("mainContent");
      const trackerView = document.getElementById("trackerView");
      const callView = document.getElementById("callSheetsView");

      if (tabName === "tracker") {
        if (mainContent) mainContent.classList.remove("hidden");
        trackerView.classList.remove("hidden");
        callView.classList.add("hidden");
        renderTrackerHeader();
      } else {
        if (mainContent) mainContent.classList.add("hidden");
        callView.classList.remove("hidden");
        trackerView.classList.add("hidden");
        renderCallSheetView();
      }
    }

    function openCallSheetForSong(id) {
      selectedCallSheetId = id;
      songPickerOpen = false;
      switchTab("callSheets");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectCallSheetSong(id) {
      selectedCallSheetId = Number(id);
      songPickerOpen = false;
      renderCallSheetView();
    }

    function stepCallSheetSong(delta) {
      songPickerOpen = false;
      const songs = state.songs;
      if (!Array.isArray(songs) || songs.length === 0) return;

      const orderedSongs = [...songs].sort((a, b) => a.id - b.id);
      const currentIdx = orderedSongs.findIndex((s) => s.id === selectedCallSheetId);
      const safeIdx = currentIdx === -1 ? 0 : currentIdx;
      const nextIdx = (safeIdx + delta + orderedSongs.length) % orderedSongs.length;
      selectedCallSheetId = orderedSongs[nextIdx].id;
      renderCallSheetView();
    }

    function toggleTransposeDrawer() {
      transposeDrawerOpen = !transposeDrawerOpen;
      renderCallSheetView();
    }

    function togglePhraseCuesHandler() {
      showPhraseCues = !showPhraseCues;
      renderCallSheetView();
    }

    document.addEventListener("click", (e) => {
      if (!songPickerOpen) return;
      const menu = document.getElementById("songPickerMenu");
      const btn = document.getElementById("songPickerBtn");
      if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
        songPickerOpen = false;
        renderCallSheetView();
      }
    });

    document.querySelectorAll(".shift-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        transposeSemitones = Number(btn.dataset.shift);
        renderCallSheetView();
      });
    });

    function syncHeaderVisibilityForTab(tabName) {
      const mainHeader = document.getElementById("mainHeader");
      if (mainHeader) {
        mainHeader.classList.toggle("hidden", tabName === "callSheets");
      }
    }

    function applyStageMode() {
      state.stageMode = true;
      document.body.classList.add("stage-mode");
    }

    applyStageMode();
    renderBeatDots();
    switchTab("tracker");
    renderTrackerTable();
    renderCallSheetView();
  </script>
</body>
